# Newsdesk: news app for Fire TV and Android phones
# (Citadel Wire, Kagi News, two local news sites and a local events listing)
# The whole project is embedded below, so this one file is all the repo needs.
# Drop it in .github/workflows/ and push. The APK appears under the run's Artifacts.
# Optional AI briefing: add a repo secret PPQ_API_KEY (and optionally a variable PPQ_MODEL).
name: Build Newsdesk APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-newsdesk.yml'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The tests live in the repo rather than in the blob below, so they can be
      # read and changed without unpacking and repacking the whole project.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          mkdir -p newsdesk
          cd newsdesk
          base64 -d > src.tgz <<'B64END'
