      - name: Build release APK
        working-directory: newsdesk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp newsdesk/app/build/outputs/apk/release/app-release.apk "out/newsdesk-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: newsdesk-apk
          path: out/*.apk
