          rm src.tgz
          find . -type f | sort

      # Both gates read the project as it was committed, so they run before the key
      # is written into config.js and long before Gradle is asked for an APK.
      - name: Check the source
        run: node tests/check-source.js newsdesk

      - name: Check the rules
        run: |
          npm i --no-save --silent jsdom
          node tests/logic.test.js newsdesk

      - name: Add PPQ.ai settings from repo secrets
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          PPQ_MODEL: ${{ vars.PPQ_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "ppqKey": os.environ.get("PPQ_API_KEY", "").strip(),
              "ppqModel": (os.environ.get("PPQ_MODEL") or "").strip(),
          }
          with open("newsdesk/app/src/main/assets/config.js", "w") as f:
              f.write("window.ND_CONFIG = " + json.dumps(cfg) + ";\n")
          print("PPQ key present:", bool(cfg["ppqKey"]), "| model:", cfg["ppqModel"] or "chosen by the app")
          PY

      - name: Build release APK
        working-directory: newsdesk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK and check it exists
        run: |
          set -e
          APK=newsdesk/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No APK was produced at $APK"
            find newsdesk/app/build/outputs -type f -print || true
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/newsdesk-${{ github.run_number }}.apk"
          ls -lh out
          echo "Built version 1.0.${{ github.run_number }}, $(du -h "$APK" | cut -f1)"
          echo "### Newsdesk 1.0.${{ github.run_number }} built, $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: newsdesk-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
