      # Both gates read the project as it was committed, so they run before the key
      # is written into config.js and long before Gradle is asked for an APK.
      - name: Check the source
        run: node tests/check-source.js newsdesk

      - name: Check the rules
        run: |
          npm i --no-save --silent jsdom
          node tests/logic.test.js newsdesk

      # The spoken-text rules are the one part of this app that can be wrong without
      # leaving a trace: a bad rule costs one daft sentence, out loud, heard once, with
      # nothing written down anywhere. Spoken.kt has no Android imports for exactly this
      # reason - it compiles on its own and runs on a JVM - so the rules get checked
      # against a list of written-out answers rather than by listening to them.
      - name: Cache the Kotlin compiler
        uses: actions/cache@v4
        with:
          path: tests/.tools
          key: kotlinc-2.0.21

      - name: Check the words a voice is given
        shell: bash
        run: |
          tests/spoken.test.sh newsdesk 2>&1 | tee spoken-report.txt
          exit "${PIPESTATUS[0]}"

      # Same reason the layout numbers are kept: a failure here is a list of before-and-
      # afters, and the logs are not readable from everywhere this gets worked on.
      - name: Keep what it said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spoken-report
          path: spoken-report.txt
          if-no-files-found: ignore

      # jsdom has no layout engine, so every width it reports is zero: it can say what
      # the page built and not what the page looks like. Every layout fault this app has
      # had reached a device, because the one thing that could have caught them was the
      # thing not being run. The runner already has a Chrome, so this costs one install
      # and a few seconds of measuring at the sizes a Fire TV and a phone actually are.
      - name: Check the layout
        shell: bash
        run: |
          npm i --no-save --silent playwright-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No browser on this runner - fetching one."
            npm i --no-save --silent playwright
            npx playwright install --with-deps chromium
            CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          fi
          echo "Measuring with $CHROME"
          CHROME_PATH="$CHROME" node tests/layout.test.js newsdesk 2>&1 | tee layout-report.txt
          exit "${PIPESTATUS[0]}"

      # Kept where it can be fetched afterwards. A failing measurement is a list of
      # numbers, and reading it back off a phone is no way to work out which of eight
      # screen sizes moved by two pixels.
      - name: Keep what the measurements said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: layout-report.txt
          if-no-files-found: ignore

      - name: Add PPQ.ai settings from repo secrets
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          PPQ_MODEL: ${{ vars.PPQ_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "ppqKey": os.environ.get("PPQ_API_KEY", "").strip(),
              "ppqModel": (os.environ.get("PPQ_MODEL") or "").strip(),
          }
          with open("newsdesk/app/src/main/assets/config.js", "w") as f:
              f.write("window.ND_CONFIG = " + json.dumps(cfg) + ";\n")
          print("PPQ key present:", bool(cfg["ppqKey"]), "| model:", cfg["ppqModel"] or "chosen by the app")
          PY

      - name: Build release APK
        working-directory: newsdesk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK and check it exists
        run: |
          set -e
          APK=newsdesk/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No APK was produced at $APK"
            find newsdesk/app/build/outputs -type f -print || true
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/newsdesk-${{ github.run_number }}.apk"
          ls -lh out
          echo "Built version 1.0.${{ github.run_number }}, $(du -h "$APK" | cut -f1)"
          echo "### Newsdesk 1.0.${{ github.run_number }} built, $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: newsdesk-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
