# Newsdesk: Fire TV news app (Citadel Wire, Kagi News, Hereford Times, Your Herefordshire)
# The whole project is embedded below, so this one file is all the repo needs.
# Drop it in .github/workflows/ and push. The APK appears under the run's Artifacts.
# Optional AI briefing: add a repo secret PPQ_API_KEY (and optionally a variable PPQ_MODEL).
name: Build Newsdesk APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-newsdesk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          mkdir -p newsdesk
          cd newsdesk
