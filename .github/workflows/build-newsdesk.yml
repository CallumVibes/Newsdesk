      - name: Add PPQ.ai settings from repo secrets
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          PPQ_MODEL: ${{ vars.PPQ_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "ppqKey": os.environ.get("PPQ_API_KEY", "").strip(),
              "ppqModel": (os.environ.get("PPQ_MODEL") or "claude-sonnet-4-5").strip(),
          }
          with open("newsdesk/app/src/main/assets/config.js", "w") as f:
              f.write("window.ND_CONFIG = " + json.dumps(cfg) + ";\n")
          print("PPQ key present:", bool(cfg["ppqKey"]), "| model:", cfg["ppqModel"])
          PY

      - name: Build release APK
        working-directory: newsdesk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp newsdesk/app/build/outputs/apk/release/app-release.apk "out/newsdesk-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: newsdesk-apk
          path: out/*.apk
