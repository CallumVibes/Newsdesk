# Publishes the app as a web page, so it can be opened in a browser and installed
# like any other app. The same index.html the APK carries: one copy, two homes.
#
# Deliberately NOT on push. This repository is public, and a published page is a
# good deal easier to come across than a file in a repository, so going live is a
# decision rather than a side effect of committing. Run it from the Actions tab when
# you want it, and re-run it whenever you want the page to catch up.
#
# The PPQ key is never written here. The APK build injects it from the secret; this
# one writes an empty config.js on purpose, so the published page has no key in it
# and simply has no AI briefing. Everything else works.
name: Publish Newsdesk as a web app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p newsdesk
          cd newsdesk
          sed -n '/base64 -d > src.tgz/,/^          B64END$/p' ../.github/workflows/build-newsdesk.yml \
            | sed '1d;$d' | sed 's/^          //' | base64 -d | tar xz
          find . -type f | sort

      - name: Check the source
        run: node tests/check-source.js newsdesk

      - name: Check the rules
        run: |
          npm i --no-save --silent jsdom
          node tests/logic.test.js newsdesk

      - name: Take the page out, with no key in it
        run: |
          mkdir -p site
          cp -r newsdesk/app/src/main/assets/. site/
          # Whatever was in the tarball, the published copy carries no key.
          printf 'window.ND_CONFIG = { ppqKey: "", ppqModel: "" };\n' > site/config.js
          # A worker that never changes is a page that never updates.
          sed -i "s/newsdesk-shell-v1/newsdesk-shell-${GITHUB_SHA::12}/" site/sw.js
          echo "--- published files ---"
          ls -la site/
          echo "--- proving no key went out ---"
          cat site/config.js
          if grep -rqiE '"(sk-|ppq-)[A-Za-z0-9_-]{8,}' site/; then
            echo "A key reached the published copy. Refusing to publish." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
